# One server on the Space's port 7860, run as an unprivileged user (pid and temp files under /tmp).
# Mirrors frontend/nginx.conf: the frontend always calls "/api/...", routed here to the backend with the prefix stripped.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    server {
        listen 7860;
        server_name _;
        root /srv/web;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # the run page streams server-sent events: no buffering, long reads
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
