# RERUN demo / replay deployment (harness-v1.6): no API key, no spend. The backend seeds the committed run records
# (DEV and gate entries only, through the TEST firewall) and refuses live execution with HTTP 409; the Gallery lists
# them and every certificate shows the outcome ladder and the blocker report.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
# The records and the firewall module live outside the backend build context, so they are bind-mounted read-only
# and DEMO_ROOT points at the mount.
services:
  backend:
    environment:
      DEMO_MODE: "1"
      DEMO_ROOT: /repo
      NEBIUS_API_KEY: ""
      TAVILY_API_KEY: ""
      NEBIUS_PROJECT_ID: ""
    volumes:
      # the whole checkout, read-only: the seed reads runs/ and the firewall, the Batch Lab reads reports/v1.9/figures.json (2026-10-10: with only runs/ and the
      # firewall mounted, the Batch Lab had no figures)
      - .:/repo:ro
