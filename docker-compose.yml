services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      # optional: `docker compose build`/`up` must work out of the box even
      # before a real .env exists (copy .env.example to get real credentials).
      - path: .env
        required: false
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
