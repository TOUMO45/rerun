server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.ts's dev-server proxy: the frontend always talks
    # to "/api", and whatever's actually serving the page (Vite in dev,
    # nginx here in Docker) is responsible for routing it to the backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
